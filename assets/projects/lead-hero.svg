<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Lead Intelligence automation funnel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182539"/>
      <stop offset="100%" stop-color="#131d2e"/>
    </linearGradient>
    <linearGradient id="funnelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4f8cff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="220" r="300" fill="url(#glow)"/>
  <circle cx="1350" cy="650" r="320" fill="url(#glowB)"/>

  <g opacity="0.5">
    <path d="M0 740 H1600" stroke="#1b2638" stroke-width="1"/>
    <path d="M0 800 H1600" stroke="#1b2638" stroke-width="1"/>
    <path d="M40 0 V900" stroke="#1b2638" stroke-width="1"/>
    <path d="M120 0 V900" stroke="#1b2638" stroke-width="1"/>
  </g>

  <g filter="url(#soft)" opacity="0.5">
    <circle cx="380" cy="240" r="70" fill="#34d399"/>
  </g>

  <text x="800" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="6" fill="#e5e9f2">LEAD INTELLIGENCE</text>
  <text x="800" y="126" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" letter-spacing="3" fill="#7c8aa0">AUTOMATED LEAD ENRICHMENT</text>

  <g font-family="Inter, system-ui, sans-serif">
    <g>
      <rect x="150" y="230" width="190" height="100" rx="14" fill="url(#stageGrad)" stroke="#34d399" stroke-width="2"/>
      <text x="245" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#e5e9f2">Google Forms</text>
      <text x="245" y="296" text-anchor="middle" font-size="11" fill="#7c8aa0">lead intake</text>
    </g>
    <g>
      <rect x="430" y="230" width="190" height="100" rx="14" fill="url(#stageGrad)" stroke="#34d399" stroke-width="2"/>
      <text x="525" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">Apps Script</text>
      <text x="525" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">+ Webhook</text>
      <text x="525" y="306" text-anchor="middle" font-size="11" fill="#7c8aa0">Cloudflare Tunnel</text>
    </g>
    <g>
      <rect x="710" y="230" width="190" height="100" rx="14" fill="url(#stageGrad)" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="750" cy="280" r="6" fill="#a78bfa"/>
      <text x="805" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">AI Enrichment</text>
      <text x="805" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">+ Guardrails</text>
      <text x="805" y="310" text-anchor="middle" font-size="11" fill="#a78bfa">OpenAI</text>
    </g>
    <g>
      <rect x="990" y="230" width="190" height="100" rx="14" fill="url(#stageGrad)" stroke="#4f8cff" stroke-width="2"/>
      <text x="1085" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#e5e9f2">Airtable CRM</text>
      <text x="1085" y="296" text-anchor="middle" font-size="11" fill="#7c8aa0">duplicate detection</text>
    </g>
    <g>
      <rect x="1270" y="230" width="190" height="100" rx="14" fill="url(#stageGrad)" stroke="#22d3ee" stroke-width="2"/>
      <text x="1365" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#e5e9f2">Slack + Email</text>
      <text x="1365" y="296" text-anchor="middle" font-size="11" fill="#7c8aa0">sales notified</text>
    </g>
  </g>

  <g stroke="#2a3a55" stroke-width="3" fill="none">
    <path d="M340 280 H422" marker-end="url(#arrow)"/>
    <path d="M620 280 H702" marker-end="url(#arrow)"/>
    <path d="M900 280 H982" marker-end="url(#arrow)"/>
    <path d="M1180 280 H1262" marker-end="url(#arrow)"/>
  </g>

  <g opacity="0.16">
    <path d="M330 560 L560 500 L800 560 L1040 500 L1270 560 L1270 700 L1040 760 L800 700 L560 760 L330 700 Z" fill="#34d399"/>
  </g>
  <path d="M330 560 L560 500 L800 560 L1040 500 L1270 560 L1270 700 L1040 760 L800 700 L560 760 L330 700 Z" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>

  <path d="M330 560 L560 500 L800 560 L1040 500 L1270 560" fill="none" stroke="#34d399" stroke-width="3" opacity="0.9"/>
  <path d="M1270 560 L1270 700 L1040 760 L800 700 L560 760 L330 700 Z" fill="none" stroke="#34d399" stroke-width="3" opacity="0.9"/>

  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="420" y="640" font-size="14" font-weight="700" fill="#34d399">raw</text>
    <text x="800" y="630" font-size="14" font-weight="700" fill="#34d399">enriched</text>
    <text x="1170" y="650" font-size="14" font-weight="700" fill="#34d399">qualified</text>
  </g>

  <g opacity="0.7" stroke="#34d399" stroke-width="2">
    <path d="M420 640 V688" stroke-dasharray="4 4"/>
    <path d="M800 630 V672" stroke-dasharray="4 4"/>
    <path d="M1170 650 V700" stroke-dasharray="4 4"/>
  </g>

  <text x="800" y="492" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5d6b82">duplicates rejected · returning contacts recognized · invalid input falls back safely</text>

  <g filter="url(#soft)" opacity="0.4">
    <circle cx="1200" cy="640" r="60" fill="#4f8cff"/>
  </g>
</svg>
