<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="SupportOps AI multi-agent routing diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2638"/>
      <stop offset="100%" stop-color="#141d2e"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2b41"/>
      <stop offset="100%" stop-color="#172238"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#223353"/>
      <stop offset="100%" stop-color="#1b2945"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blurS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4f8cff"/>
    </marker>
    <marker id="arrowM" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c8aa0"/>
    </marker>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="320" fill="url(#glow)"/>
  <circle cx="1350" cy="780" r="340" fill="url(#glowP)"/>
  <circle cx="1200" cy="180" r="220" fill="url(#glow)"/>

  <g opacity="0.5">
    <path d="M0 750 H1600" stroke="#1b2638" stroke-width="1"/>
    <path d="M0 820 H1600" stroke="#1b2638" stroke-width="1"/>
    <path d="M40 0 V900" stroke="#1b2638" stroke-width="1"/>
    <path d="M120 0 V900" stroke="#1b2638" stroke-width="1"/>
  </g>

  <g filter="url(#soft)" opacity="0.5">
    <circle cx="800" cy="190" r="90" fill="#4f8cff"/>
  </g>

  <text x="800" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="6" fill="#e5e9f2">SUPPORTOPS AI</text>
  <text x="800" y="126" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" letter-spacing="3" fill="#7c8aa0">MULTI-AGENT CUSTOMER SUPPORT</text>

  <g>
    <ellipse cx="320" cy="300" rx="70" ry="70" fill="#4f8cff" opacity="0.15"/>
    <ellipse cx="320" cy="300" rx="50" ry="50" fill="#4f8cff" opacity="0.2"/>
    <circle cx="320" cy="300" r="38" fill="url(#nodeGrad)" stroke="#4f8cff" stroke-width="2.5"/>
    <text x="320" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e5e9f2">Intake</text>
  </g>

  <g filter="url(#blurS)" opacity="0.6">
    <path d="M320 300 Q 545 300 590 300" stroke="#4f8cff" stroke-width="3" fill="none"/>
  </g>
  <path d="M320 300 Q 545 300 590 300" stroke="#4f8cff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g>
    <ellipse cx="700" cy="300" rx="76" ry="76" fill="#a78bfa" opacity="0.14"/>
    <circle cx="700" cy="300" r="50" fill="url(#accGrad)" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="700" y="296" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e5e9f2">Classifier</text>
    <text x="700" y="316" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a78bfa">+ Router</text>
  </g>

  <g>
    <ellipse cx="700" cy="420" rx="66" ry="66" fill="#a78bfa" opacity="0.1"/>
    <circle cx="700" cy="420" r="42" fill="url(#nodeGrad)" stroke="#a78bfa" stroke-width="2"/>
    <text x="700" y="417" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e5e9f2">Policy</text>
    <text x="700" y="435" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a78bfa">Guardrails</text>
  </g>

  <path d="M700 376 Q 700 400 690 412" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowA)" opacity="0.9"/>
  <path d="M700 360 Q 540 560 470 560" stroke="#7c8aa0" stroke-width="2" fill="none" opacity="0.9" marker-end="url(#arrowM)"/>

  <g font-family="Inter, system-ui, sans-serif">
    <g>
      <circle cx="330" cy="590" r="44" fill="url(#agentGrad)" stroke="#4f8cff" stroke-width="2"/>
      <circle cx="330" cy="590" r="30" fill="#4f8cff" opacity="0.12"/>
      <text x="330" y="586" text-anchor="middle" font-size="13" font-weight="700" fill="#e5e9f2">Billing</text>
      <text x="330" y="604" text-anchor="middle" font-size="11" fill="#7c8aa0">agent</text>
    </g>
    <g>
      <circle cx="560" cy="690" r="44" fill="url(#agentGrad)" stroke="#4f8cff" stroke-width="2"/>
      <circle cx="560" cy="690" r="30" fill="#4f8cff" opacity="0.12"/>
      <text x="560" y="686" text-anchor="middle" font-size="13" font-weight="700" fill="#e5e9f2">Technical</text>
      <text x="560" y="704" text-anchor="middle" font-size="11" fill="#7c8aa0">agent</text>
    </g>
    <g>
      <circle cx="800" cy="720" r="44" fill="url(#agentGrad)" stroke="#4f8cff" stroke-width="2"/>
      <circle cx="800" cy="720" r="30" fill="#4f8cff" opacity="0.12"/>
      <text x="800" y="716" text-anchor="middle" font-size="13" font-weight="700" fill="#e5e9f2">Account</text>
      <text x="800" y="734" text-anchor="middle" font-size="11" fill="#7c8aa0">agent</text>
    </g>
    <g>
      <circle cx="1040" cy="640" r="44" fill="url(#agentGrad)" stroke="#4f8cff" stroke-width="2"/>
      <circle cx="1040" cy="640" r="30" fill="#4f8cff" opacity="0.12"/>
      <text x="1040" y="636" text-anchor="middle" font-size="13" font-weight="700" fill="#e5e9f2">General</text>
      <text x="1040" y="654" text-anchor="middle" font-size="11" fill="#7c8aa0">agent</text>
    </g>
  </g>

  <g stroke="#2a3a55" stroke-width="2" fill="none" opacity="0.9">
    <path d="M700 300 Q 560 340 400 560" marker-end="url(#arrowM)"/>
    <path d="M700 300 Q 640 420 570 660" marker-end="url(#arrowM)"/>
    <path d="M700 300 Q 780 480 800 672" marker-end="url(#arrowM)"/>
    <path d="M700 300 Q 900 420 1030 610" marker-end="url(#arrowM)"/>
  </g>

  <g>
    <ellipse cx="1320" cy="300" rx="80" ry="80" fill="#4f8cff" opacity="0.12"/>
    <circle cx="1320" cy="300" r="54" fill="url(#accGrad)" stroke="#e5e9f2" stroke-width="2"/>
    <text x="1320" y="296" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e5e9f2">Supervisor</text>
    <text x="1320" y="316" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7c8aa0">escalation</text>
  </g>

  <path d="M1180 300 Q 1250 300 1262 300" stroke="#e5e9f2" stroke-width="2" fill="none" opacity="0.8" marker-end="url(#arrow)"/>

  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5d6b82">
    <text x="330" y="430" text-anchor="middle">Customer</text>
    <text x="330" y="446" text-anchor="middle">request</text>
    <text x="1120" y="300" text-anchor="middle">high-risk</text>
    <text x="1120" y="316" text-anchor="middle">cases</text>
    <text x="700" y="520" text-anchor="middle">routed to specialist agents</text>
  </g>

  <g filter="url(#soft)" opacity="0.5">
    <circle cx="1320" cy="300" r="60" fill="#e5e9f2"/>
  </g>
</svg>
