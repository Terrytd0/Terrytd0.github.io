<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="SupportOps AI multi-agent routing diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2638"/>
      <stop offset="100%" stop-color="#141d2e"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2b41"/>
      <stop offset="100%" stop-color="#172238"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#223353"/>
      <stop offset="100%" stop-color="#1b2945"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182539"/>
      <stop offset="100%" stop-color="#131d2e"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4f8cff"/>
    </marker>
    <marker id="arrowW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#e5e9f2"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="320" fill="url(#glow)"/>
  <circle cx="1350" cy="300" r="300" fill="url(#glowP)"/>
  <circle cx="600" cy="820" r="260" fill="url(#glow)"/>

  <g opacity="0.5">
    <path d="M0 750 H1600" stroke="#1b2638" stroke-width="1"/>
    <path d="M0 820 H1600" stroke="#1b2638" stroke-width="1"/>
    <path d="M40 0 V900" stroke="#1b2638" stroke-width="1"/>
    <path d="M120 0 V900" stroke="#1b2638" stroke-width="1"/>
  </g>

  <text x="800" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="6" fill="#e5e9f2">SUPPORTOPS AI</text>
  <text x="800" y="126" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" letter-spacing="3" fill="#7c8aa0">MULTI-AGENT CUSTOMER SUPPORT</text>

  <!-- Intake -->
  <g>
    <ellipse cx="250" cy="300" rx="60" ry="60" fill="#4f8cff" opacity="0.15"/>
    <circle cx="250" cy="300" r="45" fill="url(#nodeGrad)" stroke="#4f8cff" stroke-width="2.5"/>
    <text x="250" y="296" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e5e9f2">Intake</text>
    <text x="250" y="315" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#7c8aa0">customer request</text>
  </g>

  <!-- Intake -> Classifier -->
  <path d="M295 300 Q 420 300 545 300" stroke="#4f8cff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Classifier -->
  <g>
    <ellipse cx="600" cy="300" rx="66" ry="66" fill="#a78bfa" opacity="0.14"/>
    <circle cx="600" cy="300" r="52" fill="url(#accGrad)" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="600" y="296" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e5e9f2">Classifier</text>
    <text x="600" y="315" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a78bfa">+ Router</text>
  </g>

  <!-- Classifier -> Supervisor (escalation) -->
  <path d="M652 300 Q 960 300 1288 300" stroke="#e5e9f2" stroke-width="2.5" fill="none" opacity="0.9" marker-end="url(#arrowW)"/>
  <text x="970" y="286" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e9f2">high-risk → escalation</text>

  <!-- Supervisor -->
  <g>
    <ellipse cx="1350" cy="300" rx="70" ry="70" fill="#4f8cff" opacity="0.14"/>
    <circle cx="1350" cy="300" r="55" fill="url(#accGrad)" stroke="#4f8cff" stroke-width="3"/>
    <text x="1350" y="296" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e5e9f2">Supervisor</text>
    <text x="1350" y="315" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a78bfa">approval</text>
  </g>

  <!-- Classifier -> agents (fan) -->
  <g stroke="#2a3a55" stroke-width="2.5" fill="none">
    <path d="M585 342 Q 390 480 248 570" marker-end="url(#arrow)"/>
    <path d="M600 352 Q 570 480 540 570" marker-end="url(#arrow)"/>
    <path d="M600 352 Q 650 480 892 570" marker-end="url(#arrow)"/>
    <path d="M612 344 Q 820 480 1172 570" marker-end="url(#arrow)"/>
  </g>

  <!-- Agents -->
  <g font-family="Inter, system-ui, sans-serif">
    <g>
      <circle cx="240" cy="620" r="50" fill="url(#agentGrad)" stroke="#4f8cff" stroke-width="2"/>
      <circle cx="240" cy="620" r="34" fill="#4f8cff" opacity="0.1"/>
      <text x="240" y="616" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">Billing</text>
      <text x="240" y="634" text-anchor="middle" font-size="11" fill="#7c8aa0">agent</text>
    </g>
    <g>
      <circle cx="540" cy="620" r="50" fill="url(#agentGrad)" stroke="#4f8cff" stroke-width="2"/>
      <circle cx="540" cy="620" r="34" fill="#4f8cff" opacity="0.1"/>
      <text x="540" y="616" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">Technical</text>
      <text x="540" y="634" text-anchor="middle" font-size="11" fill="#7c8aa0">agent</text>
    </g>
    <g>
      <circle cx="900" cy="620" r="50" fill="url(#agentGrad)" stroke="#4f8cff" stroke-width="2"/>
      <circle cx="900" cy="620" r="34" fill="#4f8cff" opacity="0.1"/>
      <text x="900" y="616" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">Account</text>
      <text x="900" y="634" text-anchor="middle" font-size="11" fill="#7c8aa0">agent</text>
    </g>
    <g>
      <circle cx="1180" cy="620" r="50" fill="url(#agentGrad)" stroke="#4f8cff" stroke-width="2"/>
      <circle cx="1180" cy="620" r="34" fill="#4f8cff" opacity="0.1"/>
      <text x="1180" y="616" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">General</text>
      <text x="1180" y="634" text-anchor="middle" font-size="11" fill="#7c8aa0">agent</text>
    </g>
  </g>

  <text x="800" y="724" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5d6b82">specialist agents share common tooling &amp; orchestration</text>

  <!-- Classifier -> Policy bar -->
  <path d="M600 352 V 786" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.7"/>

  <!-- Policy bar -->
  <g>
    <rect x="420" y="790" width="360" height="66" rx="14" fill="url(#barGrad)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="600" y="820" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e5e9f2">Policy &amp; Guardrails</text>
    <text x="600" y="842" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7c8aa0">JWT auth · rate limiting · audit log</text>
  </g>
</svg>
