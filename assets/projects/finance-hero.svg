<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Finance Intelligence Platform seven-stage pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182539"/>
      <stop offset="100%" stop-color="#131d2e"/>
    </linearGradient>
    <linearGradient id="stageAcc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2c45"/>
      <stop offset="100%" stop-color="#15203a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="250" cy="200" r="300" fill="url(#glow)"/>
  <circle cx="1380" cy="700" r="320" fill="url(#glowG)"/>

  <g opacity="0.5">
    <path d="M0 740 H1600" stroke="#1b2638" stroke-width="1"/>
    <path d="M0 800 H1600" stroke="#1b2638" stroke-width="1"/>
    <path d="M40 0 V900" stroke="#1b2638" stroke-width="1"/>
    <path d="M120 0 V900" stroke="#1b2638" stroke-width="1"/>
  </g>

  <g filter="url(#soft)" opacity="0.5">
    <circle cx="400" cy="200" r="70" fill="#22d3ee"/>
  </g>

  <text x="800" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="6" fill="#e5e9f2">FINANCE INTELLIGENCE</text>
  <text x="800" y="126" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" letter-spacing="3" fill="#7c8aa0">END-TO-END DATA AUTOMATION PIPELINE</text>

  <g font-family="Inter, system-ui, sans-serif">
    <g>
      <rect x="120" y="240" width="168" height="96" rx="14" fill="url(#stageGrad)" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="160" cy="288" r="6" fill="#22d3ee"/>
      <text x="204" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">Ingestion</text>
      <text x="204" y="302" text-anchor="middle" font-size="11" fill="#7c8aa0">data sources</text>
    </g>
    <g>
      <rect x="344" y="240" width="168" height="96" rx="14" fill="url(#stageGrad)" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="384" cy="288" r="6" fill="#22d3ee"/>
      <text x="428" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">Validation</text>
      <text x="428" y="302" text-anchor="middle" font-size="11" fill="#7c8aa0">schemas &amp; rules</text>
    </g>
    <g>
      <rect x="568" y="240" width="168" height="96" rx="14" fill="url(#stageGrad)" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="608" cy="288" r="6" fill="#22d3ee"/>
      <text x="652" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">KPI Engine</text>
      <text x="652" y="302" text-anchor="middle" font-size="11" fill="#7c8aa0">metrics</text>
    </g>
    <g>
      <rect x="792" y="240" width="168" height="96" rx="14" fill="url(#stageAcc)" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="832" cy="288" r="6" fill="#a78bfa"/>
      <text x="876" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">AI Anomaly</text>
      <text x="876" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">Detection</text>
      <text x="876" y="314" text-anchor="middle" font-size="11" fill="#a78bfa">OpenAI</text>
    </g>
    <g>
      <rect x="1016" y="240" width="168" height="96" rx="14" fill="url(#stageGrad)" stroke="#34d399" stroke-width="2"/>
      <circle cx="1056" cy="288" r="6" fill="#34d399"/>
      <text x="1100" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">Reporting</text>
      <text x="1100" y="302" text-anchor="middle" font-size="11" fill="#7c8aa0">executive</text>
    </g>
    <g>
      <rect x="1240" y="240" width="168" height="96" rx="14" fill="url(#stageGrad)" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="1280" cy="288" r="6" fill="#22d3ee"/>
      <text x="1324" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#e5e9f2">Notify</text>
      <text x="1324" y="302" text-anchor="middle" font-size="11" fill="#7c8aa0">Slack / email</text>
    </g>
  </g>

  <g stroke="#2a3a55" stroke-width="3" fill="none">
    <path d="M288 288 H336" marker-end="url(#arrow)"/>
    <path d="M512 288 H560" marker-end="url(#arrow)"/>
    <path d="M736 288 H784" marker-end="url(#arrow)"/>
    <path d="M960 288 H1008" marker-end="url(#arrow)"/>
    <path d="M1184 288 H1232" marker-end="url(#arrow)"/>
    <path d="M1408 288 H1432"/>
  </g>

  <g>
    <ellipse cx="800" cy="560" rx="240" ry="120" fill="none" stroke="#2a3a55" stroke-width="2" stroke-dasharray="10 10" opacity="0.8"/>
    <circle cx="800" cy="560" r="60" fill="url(#stageAcc)" stroke="#34d399" stroke-width="2.5"/>
    <text x="800" y="556" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e5e9f2">Audit</text>
    <text x="800" y="576" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#7c8aa0">log</text>
  </g>

  <path d="M1400 288 Q 1520 288 1520 560 Q 1520 660 1410 660 Q 1080 660 880 610" stroke="#2a3a55" stroke-width="2" fill="none" stroke-dasharray="8 8" opacity="0.9"/>
  <path d="M730 570 Q 900 620 830 610" stroke="#34d399" stroke-width="2" fill="none" opacity="0.8"/>

  <text x="800" y="452" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5d6b82">every stage emits structured audit events</text>

  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5d6b82">
    <text x="204" y="368" text-anchor="middle">CSV · Excel · API</text>
    <text x="1100" y="368" text-anchor="middle">board-ready</text>
    <text x="1100" y="382" text-anchor="middle">insights</text>
  </g>
</svg>
